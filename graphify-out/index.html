<html lang="en">

<title>Siperben — Knowledge Graph</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3348;
    --text: #e2e8f0;
    --text-muted: #8892a4;
    --accent: #7c6be8;
    --accent2: #5fd4a8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
    z-index: 10;
  }
  header h1 {
    font-size: 1.1rem;
    font-weight: 700;
    background: linear-gradient(135deg, #a78bfa, #5fd4a8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  header .subtitle {
    font-size: 0.75rem;
    color: var(--text-muted);
  }
  .stats-bar {
    margin-left: auto;
    display: flex;
    gap: 20px;
  }
  .stat {
    text-align: center;
  }
  .stat-val {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--accent2);
  }
  .stat-lbl {
    font-size: 0.65rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .layout {
    display: flex;
    flex: 1;
    overflow: hidden;
  }
  #sidebar {
    width: 280px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
  }
  .sidebar-section {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-section h3 {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
    cursor: pointer;
    border-radius: 4px;
    transition: background 0.15s;
  }
  .legend-item:hover { background: var(--surface2); }
  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .legend-label {
    font-size: 0.78rem;
    color: var(--text);
  }
  .legend-count {
    margin-left: auto;
    font-size: 0.7rem;
    color: var(--text-muted);
    background: var(--surface2);
    padding: 1px 6px;
    border-radius: 10px;
  }
  #search-box {
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
  }
  #search-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 10px;
    border-radius: 6px;
    font-size: 0.82rem;
    outline: none;
    transition: border-color 0.2s;
  }
  #search-input:focus { border-color: var(--accent); }
  #node-detail {
    flex: 1;
    overflow-y: auto;
    padding: 12px 14px;
  }
  #node-detail.empty {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 0.8rem;
    text-align: center;
    flex-direction: column;
    gap: 8px;
  }
  .detail-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 0.68rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }
  .detail-name {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 6px;
  }
  .detail-desc {
    font-size: 0.78rem;
    color: var(--text-muted);
    line-height: 1.55;
    margin-bottom: 10px;
  }
  .detail-path {
    font-size: 0.72rem;
    color: var(--accent2);
    font-family: monospace;
    background: var(--surface2);
    padding: 4px 8px;
    border-radius: 4px;
    word-break: break-all;
    margin-bottom: 10px;
  }
  .detail-section-title {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--text-muted);
    margin: 10px 0 5px;
  }
  .detail-edge {
    font-size: 0.76rem;
    color: var(--text);
    padding: 3px 0 3px 8px;
    border-left: 2px solid var(--border);
    margin-bottom: 3px;
  }
  .detail-edge .rel-label {
    color: var(--text-muted);
    font-size: 0.68rem;
    font-style: italic;
  }

    display: inline-block;
    background: linear-gradient(135deg, #ff6b6b, #ffd93d);
    color: #1a0000;
    font-size: 0.62rem;
    padding: 1px 6px;
    border-radius: 8px;
    font-weight: 800;
    margin-left: 6px;
    text-transform: uppercase;
  }
  #canvas-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 50%, #131726 0%, #0a0c13 100%);
  }
  canvas { position: absolute; top: 0; left: 0; cursor: grab; }
  canvas:active { cursor: grabbing; }
  .controls {
    position: absolute;
    bottom: 16px;
    right: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .ctrl-btn {
    width: 32px; height: 32px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    cursor: pointer;
    font-size: 1rem;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .ctrl-btn:hover { background: var(--surface2); }
  .tooltip {
    position: absolute;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 0.75rem;
    pointer-events: none;
    z-index: 100;
    max-width: 200px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    display: none;
  }
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
  }
  .filter-chip {
    font-size: 0.7rem;
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s;
    text-transform: capitalize;
  }
  .filter-chip.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

</header>
<div class="layout">

// ── CANVAS GRAPH ENGINE ──────────────────────────────────────────
const canvas = document.getElementById('graph');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('canvas-wrap');

let nodes = [], links = [];
let transform = { x: 0, y: 0, scale: 1 };
let dragging = false, dragNode = null;
let mouseX = 0, mouseY = 0, panStart = null;
let hoveredNode = null, selectedNode = null;
let activeFilter = 'all';
let searchTerm = '';

const commColors = {};
GRAPH.communities.forEach(c => commColors[c.id] = c.color);

function typeShape(type) {
  const map = { framework:'diamond', library:'hexagon', config:'rect', helper:'rect',
                hook:'triangle', controller:'circle', database:'cylinder', 
                dependency:'hexagon', external_service:'star', theme:'rect',
                class:'circle', entrypoint:'star' };
  return map[type] || 'circle';
}

function initNodes() {
  const W = wrap.clientWidth, H = wrap.clientHeight;
  nodes = GRAPH.nodes.map((n, i) => {
    const angle = (i / GRAPH.nodes.length) * Math.PI * 2;
    const r = 280 + (n.weight * 10);
    return {
      ...n,
      x: W/2 + Math.cos(angle)*r + (Math.random()-0.5)*100,
      y: H/2 + Math.sin(angle)*r + (Math.random()-0.5)*100,
      vx: 0, vy: 0,
      radius: Math.max(8, n.weight * 2.2)
    };
  });
  links = GRAPH.edges.map(e => ({
    ...e,
    source: nodes.find(n => n.id === e.source),
    target: nodes.find(n => n.id === e.target)
  })).filter(l => l.source && l.target);
}

// Force-directed layout
let simRunning = true, simStep = 0;
function simulate() {
  if (!simRunning) return;
  const alpha = Math.max(0.001, 0.3 * (1 - simStep/300));
  simStep++;
  if (simStep > 300) simRunning = false;

  // Repulsion
  for (let i=0; i<nodes.length; i++) {
    for (let j=i+1; j<nodes.length; j++) {
      const a=nodes[i], b=nodes[j];
      let dx=b.x-a.x, dy=b.y-a.y;
      const dist=Math.sqrt(dx*dx+dy*dy)||1;
      const force = 3000 / (dist*dist);
      const fx = (dx/dist)*force*alpha;
      const fy = (dy/dist)*force*alpha;
      a.vx -= fx; a.vy -= fy;
      b.vx += fx; b.vy += fy;
    }
  }

  // Attraction along edges
  links.forEach(l => {
    if (!l.source || !l.target) return;
    const dx = l.target.x - l.source.x;
    const dy = l.target.y - l.source.y;
    const dist = Math.sqrt(dx*dx+dy*dy)||1;
    const ideal = 120;
    const force = (dist - ideal) * 0.05 * alpha;
    const fx = (dx/dist)*force;
    const fy = (dy/dist)*force;
    l.source.vx += fx; l.source.vy += fy;
    l.target.vx -= fx; l.target.vy -= fy;
  });

  // Community clustering
  const centers = {};
  GRAPH.communities.forEach(c => { centers[c.id]={x:0,y:0,count:0}; });
  nodes.forEach(n => { centers[n.community].x+=n.x; centers[n.community].y+=n.y; centers[n.community].count++; });
  Object.keys(centers).forEach(k => {
    const c = centers[k];
    if (c.count) { c.x/=c.count; c.y/=c.count; }
  });
  nodes.forEach(n => {
    const c = centers[n.community];
    n.vx += (c.x - n.x) * 0.008 * alpha;
    n.vy += (c.y - n.y) * 0.008 * alpha;
  });

  nodes.forEach(n => {
    if (n === dragNode) return;
    n.vx *= 0.7; n.vy *= 0.7;
    n.x += n.vx; n.y += n.vy;
  });
}

// Drawing helpers
function drawShape(x, y, r, shape, color, stroke, strokeW=1.5) {
  ctx.beginPath();
  switch(shape) {
    case 'diamond':
      ctx.moveTo(x, y-r*1.3); ctx.lineTo(x+r*1.3, y); ctx.lineTo(x, y+r*1.3); ctx.lineTo(x-r*1.3, y); ctx.closePath(); break;
    case 'hexagon': {
      for(let i=0;i<6;i++){
        const a=Math.PI/2+i*Math.PI/3;
        i===0?ctx.moveTo(x+r*Math.cos(a),y+r*Math.sin(a)):ctx.lineTo(x+r*Math.cos(a),y+r*Math.sin(a));
      } ctx.closePath(); break; }
    case 'triangle':
      ctx.moveTo(x, y-r*1.3); ctx.lineTo(x+r*1.3, y+r); ctx.lineTo(x-r*1.3, y+r); ctx.closePath(); break;
    case 'rect':
      ctx.rect(x-r, y-r*0.7, r*2, r*1.4); break;
    case 'star': {
      for(let i=0;i<10;i++){
        const a=i*Math.PI/5-Math.PI/2;
        const ir=i%2===1?r*0.45:r;
        i===0?ctx.moveTo(x+ir*Math.cos(a),y+ir*Math.sin(a)):ctx.lineTo(x+ir*Math.cos(a),y+ir*Math.sin(a));
      } ctx.closePath(); break; }
    default:
      ctx.arc(x, y, r, 0, Math.PI*2);
  }
  ctx.fillStyle = color;
  ctx.fill();
  if (stroke) {
    ctx.strokeStyle = stroke;
    ctx.lineWidth = strokeW;
    ctx.stroke();
  }
}

function isVisible(n) {
  if (activeFilter !== 'all' && n.type !== activeFilter) return false;
  if (searchTerm && !n.label.toLowerCase().includes(searchTerm) && !n.id.toLowerCase().includes(searchTerm)) return false;
  return true;
}

function draw() {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.translate(transform.x, transform.y);
  ctx.scale(transform.scale, transform.scale);

  // Draw edges
  links.forEach(l => {
    if (!isVisible(l.source) || !isVisible(l.target)) return;
    const dx = l.target.x - l.source.x;
    const dy = l.target.y - l.source.y;
    const dist = Math.sqrt(dx*dx+dy*dy)||1;
    const isHighlighted = selectedNode && (l.source === selectedNode || l.target === selectedNode);
    const alpha2 = selectedNode ? (isHighlighted ? 0.9 : 0.05) : 0.25;

    ctx.beginPath();
    ctx.moveTo(l.source.x, l.source.y);
    ctx.lineTo(l.target.x, l.target.y);
    ctx.strokeStyle = isHighlighted
      ? commColors[l.source.community] + 'cc'
      : commColors[l.source.community] + Math.round(alpha2*255).toString(16).padStart(2,'0');
    ctx.lineWidth = isHighlighted ? 2 : 1;
    ctx.stroke();

    // Arrow
    if (isHighlighted) {
      const ax = l.target.x - (dx/dist)*l.target.radius;
      const ay = l.target.y - (dy/dist)*l.target.radius;
      const angle = Math.atan2(dy, dx);
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(ax - 8*Math.cos(angle-0.4), ay - 8*Math.sin(angle-0.4));
      ctx.lineTo(ax - 8*Math.cos(angle+0.4), ay - 8*Math.sin(angle+0.4));
      ctx.closePath();
      ctx.fillStyle = commColors[l.source.community];
      ctx.fill();
    }
  });

  // Draw nodes
  nodes.forEach(n => {
    if (!isVisible(n)) return;
    const color = commColors[n.community];
    const isSelected = n === selectedNode;
    const isHovered = n === hoveredNode;
    const dimmed = selectedNode && n !== selectedNode &&
      !links.some(l => (l.source===selectedNode&&l.target===n)||(l.target===selectedNode&&l.source===n));
    const nodeAlpha = dimmed ? 0.2 : 1;

    ctx.globalAlpha = nodeAlpha;

    // Glow for god nodes or selected
    if (n.god_node || isSelected) {
      const grd = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.radius*2.5);
      grd.addColorStop(0, color + '55');
      grd.addColorStop(1, color + '00');
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.radius*2.5, 0, Math.PI*2);
      ctx.fillStyle = grd;
      ctx.fill();
    }

    const shape = typeShape(n.type);
    const strokeColor = isSelected ? '#ffffff' : isHovered ? color : color + '99';
    const strokeW = isSelected ? 3 : isHovered ? 2 : 1.5;

    // Fill with gradient
    const grd2 = ctx.createRadialGradient(n.x-n.radius*0.3, n.y-n.radius*0.3, 0, n.x, n.y, n.radius*1.5);
    grd2.addColorStop(0, color + 'ee');
    grd2.addColorStop(1, color + '66');

    drawShape(n.x, n.y, n.radius, shape, grd2, strokeColor, strokeW);

    // Labels
    if (transform.scale > 0.6 || isSelected || isHovered) {
      ctx.globalAlpha = nodeAlpha;
      ctx.fillStyle = '#ffffff';
      ctx.font = `${isSelected?'bold ':''}${Math.max(9, 10/transform.scale*0.7)}px Segoe UI`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      const label = n.label.length > 20 ? n.label.slice(0,18)+'…' : n.label;
      ctx.fillText(label, n.x, n.y + n.radius + 3);
    }

    ctx.globalAlpha = 1;
  });

  ctx.restore();
  simulate();
  requestAnimationFrame(draw);
}

// ── INTERACTION ──────────────────────────────────────────────────
function toGraph(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left - transform.x) / transform.scale,
    y: (clientY - rect.top  - transform.y) / transform.scale
  };
}

function findNode(cx, cy) {
  const p = toGraph(cx, cy);
  return nodes.slice().reverse().find(n => {
    if (!isVisible(n)) return false;
    const dx=n.x-p.x, dy=n.y-p.y;
    return Math.sqrt(dx*dx+dy*dy) < n.radius+8;
  });
}

canvas.addEventListener('mousedown', e => {
  dragNode = findNode(e.clientX, e.clientY);
  if (!dragNode) { dragging = true; panStart = {x:e.clientX-transform.x, y:e.clientY-transform.y}; }
  else { simRunning = true; }
});

canvas.addEventListener('mousemove', e => {
  mouseX = e.clientX; mouseY = e.clientY;
  if (dragNode) {
    const p = toGraph(e.clientX, e.clientY);
    dragNode.x = p.x; dragNode.y = p.y;
    dragNode.vx = 0; dragNode.vy = 0;
  } else if (dragging && panStart) {
    transform.x = e.clientX - panStart.x;
    transform.y = e.clientY - panStart.y;
  } else {
    const h = findNode(e.clientX, e.clientY);
    if (h !== hoveredNode) {
      hoveredNode = h;
      showTooltip(h, e);
    }
  }
});

canvas.addEventListener('mouseup', e => {
  if (!dragging && !dragNode) {
    const clicked = findNode(e.clientX, e.clientY);
    if (clicked) showDetail(clicked);
    else if (selectedNode) { selectedNode = null; }
  }
  dragging = false; dragNode = null; panStart = null;
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.1 : 0.9;
  const rect = canvas.getBoundingClientRect();
  const cx = e.clientX - rect.left;
  const cy = e.clientY - rect.top;
  transform.x = cx - (cx-transform.x)*factor;
  transform.y = cy - (cy-transform.y)*factor;
  transform.scale *= factor;
  transform.scale = Math.max(0.1, Math.min(5, transform.scale));
}, { passive: false });

// Tooltip
const tooltip = document.getElementById('tooltip');
function showTooltip(node, e) {
  if (!node) { tooltip.style.display='none'; return; }
  tooltip.innerHTML = `<strong>${node.label}</strong><br><span style="color:#8892a4;font-size:0.68rem">${node.type}</span>`;
  tooltip.style.display = 'block';
  tooltip.style.left = (e.clientX - wrap.getBoundingClientRect().left + 12) + 'px';
  tooltip.style.top  = (e.clientY - wrap.getBoundingClientRect().top - 10) + 'px';
}
canvas.addEventListener('mouseleave', () => { tooltip.style.display='none'; hoveredNode=null; });

// Node detail panel
function showDetail(n) {
  selectedNode = n;
  const panel = document.getElementById('node-detail');
  panel.classList.remove('empty');

  const incoming = links.filter(l => l.target === n).map(l => `<div class="detail-edge">← ${l.source.label} <span class="rel-label">${l.relation}</span></div>`);
  const outgoing = links.filter(l => l.source === n).map(l => `<div class="detail-edge">→ ${l.target.label} <span class="rel-label">${l.relation}</span></div>`);
  const comm = GRAPH.communities.find(c=>c.id===n.community);

  panel.innerHTML = `
    <div class="detail-badge" style="background:${comm.color}33;color:${comm.color}">${n.type}</div>
    ${n.god_node?'<span class="god-badge">⚡ God Node</span>':''}
    <div class="detail-name">${n.label}</div>
    <div class="detail-desc">${n.description||''}</div>
    <div class="detail-path">${n.path||''}</div>
    <div class="detail-section-title" style="color:${comm.color}">${comm.name}</div>
    ${outgoing.length?`<div class="detail-section-title">→ Outgoing (${outgoing.length})</div>${outgoing.join('')}`:''}
    ${incoming.length?`<div class="detail-section-title">← Incoming (${incoming.length})</div>${incoming.join('')}`:''}
  `;
}

// Legend
const legendEl = document.getElementById('legend');
GRAPH.communities.forEach(c => {
  const count = GRAPH.nodes.filter(n=>n.community===c.id).length;
  const el = document.createElement('div');
  el.className='legend-item';
  el.innerHTML=`<div class="legend-dot" style="background:${c.color}"></div><div class="legend-label">${c.name}</div><div class="legend-count">${count}</div>`;
  el.addEventListener('click', () => {
    const focused = nodes.filter(n=>n.community===c.id);
    selectedNode = null;
    activeFilter='all';
    searchTerm='';
    document.getElementById('search-input').value='';
    document.querySelectorAll('.filter-chip').forEach(x=>x.classList.remove('active'));
  });
  legendEl.appendChild(el);
});

// Filter chips
const types = [...new Set(GRAPH.nodes.map(n=>n.type))];
const filterBar = document.getElementById('filter-bar');
['all',...types].forEach(t => {
  const chip = document.createElement('div');
  chip.className='filter-chip'+(t==='all'?' active':'');
  chip.textContent = t==='all'?'All':t;
  chip.addEventListener('click', ()=>{
    activeFilter=t;
    document.querySelectorAll('.filter-chip').forEach(x=>x.classList.remove('active'));
    chip.classList.add('active');
  });
  filterBar.appendChild(chip);
});

// Search
document.getElementById('search-input').addEventListener('input', e => {
  searchTerm = e.target.value.toLowerCase().trim();
});

// Zoom controls
document.getElementById('zoom-in').addEventListener('click', ()=>{ transform.scale=Math.min(5,transform.scale*1.25); });
document.getElementById('zoom-out').addEventListener('click', ()=>{ transform.scale=Math.max(0.1,transform.scale*0.8); });
document.getElementById('zoom-fit').addEventListener('click', ()=>{
  transform={x:0,y:0,scale:1};
  initNodes(); simRunning=true; simStep=0;
});

// Resize
function resize() {
  canvas.width  = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
}
window.addEventListener('resize', resize);
resize();
initNodes();
draw();
</script>
</body>
</html>
