<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphify - Siperben Knowledge Graph Explorer</title>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg-color); color: var(--text); overflow: hidden; display: flex; height: 100vh; }
        
        #sidebar {
            width: 360px;
            background: var(--panel-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 1rem;
            gap: 1rem;
            z-index: 10;
            overflow-y: auto;
        }
        .title-area h1 { font-size: 1.25rem; font-weight: 700; color: var(--accent); }
        .title-area p { font-size: 0.8rem; color: var(--text-dim); margin-top: 0.25rem; }

        .search-box input {
            width: 100%;
            padding: 0.6rem 0.8rem;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: #fff;
            font-size: 0.9rem;
        }
        .search-box input:focus { outline: 1px solid var(--accent); }

        .section-box {
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.8rem;
        }
        .section-box h3 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); margin-bottom: 0.5rem; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
        .stat-card { background: #1e293b; padding: 0.5rem; border-radius: 4px; text-align: center; }
        .stat-card .val { font-size: 1.1rem; font-weight: bold; color: var(--accent); }
        .stat-card .lbl { font-size: 0.7rem; color: var(--text-dim); }

        .legend-list { display: flex; flex-direction: column; gap: 0.4rem; font-size: 0.8rem; }
        .legend-item { display: flex; align-items: center; gap: 0.5rem; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

        #main-canvas { flex: 1; position: relative; }
        svg { width: 100%; height: 100%; cursor: grab; }
        svg:active { cursor: grabbing; }

        .node text { font-size: 10px; fill: #cbd5e1; pointer-events: none; }
        .node circle { stroke: #fff; stroke-width: 1.5px; transition: r 0.2s, stroke 0.2s; }
        .node:hover circle { stroke: var(--accent); stroke-width: 3px; cursor: pointer; }

        .link { stroke: #475569; stroke-opacity: 0.5; stroke-width: 1.2px; }
        .link.highlight { stroke: var(--accent); stroke-opacity: 1; stroke-width: 2.5px; }

        #detail-drawer {
            position: absolute;
            right: 1rem;
            top: 1rem;
            width: 320px;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            display: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 20;
        }
        #detail-drawer h2 { font-size: 1.1rem; color: var(--accent); word-break: break-all; }
        #detail-drawer p { font-size: 0.85rem; margin-top: 0.5rem; color: var(--text-dim); }
        #detail-drawer .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; background: #334155; color: #fff; margin-top: 0.4rem; }
        #detail-drawer .close-btn { float: right; cursor: pointer; color: #94a3b8; font-weight: bold; }
    </style>
</head>
<body>
    <div id="sidebar">
        <div class="title-area">
            <h1>Siperben Graphify</h1>
            <p>Interactive Knowledge Graph Explorer</p>
        </div>

        <div class="search-box">
            <input type="text" id="search-input" placeholder="Search node by name or type..." oninput="filterGraph()">
        </div>

        <div class="section-box">
            <h3>Graph Statistics</h3>
            <div class="stats-grid">
                <div class="stat-card"><div class="val" id="stat-nodes">0</div><div class="lbl">Nodes</div></div>
                <div class="stat-card"><div class="val" id="stat-edges">0</div><div class="lbl">Edges</div></div>
                <div class="stat-card"><div class="val" id="stat-gods">0</div><div class="lbl">God Nodes</div></div>
                <div class="stat-card"><div class="val" id="stat-comms">0</div><div class="lbl">Communities</div></div>
            </div>
        </div>

        <div class="section-box">
            <h3>Communities</h3>
            <div class="legend-list" id="community-legend"></div>
        </div>

        <div class="section-box">
            <h3>Top God Nodes</h3>
            <div class="legend-list" id="god-nodes-list"></div>
        </div>
    </div>

    <div id="main-canvas">
        <svg id="svg-canvas"></svg>
        <div id="detail-drawer">
            <span class="close-btn" onclick="closeDetail()">&times;</span>
            <h2 id="detail-title">Node Name</h2>
            <div id="detail-type" class="badge">Type</div>
            <p id="detail-desc">Description</p>
            <div style="margin-top:0.8rem; font-size:0.8rem; color:#94a3b8;">
                <div>Degree: <span id="detail-degree" style="color:#fff;">0</span> (In: <span id="detail-in">0</span>, Out: <span id="detail-out">0</span>)</div>
                <div>Community: <span id="detail-comm" style="color:#fff;">-</span></div>
                <div id="detail-file-container" style="margin-top:0.4rem; word-break:break-all;">File: <span id="detail-file" style="color:#38bdf8;">-</span></div>
            </div>
        </div>
    </div>

    <script>
        let graphData = null;
        let simulation = null;
        let svg, g, link, node;

        const colorMap = {
            'Perbendaharaan (Treasury & SK)': '#38bdf8',
            'Kepegawaian (HR & Staff)': '#4ade80',
            'Privileges & User Mgmt': '#f43f5e',
            'Dashboard & Analytics': '#fbbf24',
            'Public & Auth Actions': '#a855f7',
            'Configuration': '#64748b',
            'System Core': '#ec4899',
            'Shared Utilities': '#14b8a6',
            'General & Infrastructure': '#94a3b8'
        };

        fetch('graph.json')
            .then(res => res.json())
            .then(data => {
                graphData = data;
                initUI();
                renderGraph();
            });

        function initUI() {
            document.getElementById('stat-nodes').innerText = graphData.nodes.length;
            document.getElementById('stat-edges').innerText = graphData.edges.length;
            document.getElementById('stat-gods').innerText = graphData.god_nodes.length;
            document.getElementById('stat-comms').innerText = Object.keys(graphData.communities).length;

            const legendEl = document.getElementById('community-legend');
            Object.keys(graphData.communities).forEach(comm => {
                const color = colorMap[comm] || '#94a3b8';
                legendEl.innerHTML += `
                    <div class="legend-item">
                        <span class="dot" style="background:${color}"></span>
                        <span>${comm} (${graphData.communities[comm]})</span>
                    </div>
                `;
            });

            const godEl = document.getElementById('god-nodes-list');
            graphData.god_nodes.slice(0, 8).forEach(g => {
                godEl.innerHTML += `
                    <div class="legend-item" style="cursor:pointer;" onclick="selectNode('${g.id}')">
                        <span style="color:#38bdf8; font-weight:bold;">★ ${g.label}</span>
                        <span style="color:#94a3b8; font-size:0.75rem;">(deg: ${g.degree})</span>
                    </div>
                `;
            });
        }

        function renderGraph() {
            const width = document.getElementById('main-canvas').clientWidth;
            const height = document.getElementById('main-canvas').clientHeight;

            svg = d3.select("#svg-canvas");
            svg.selectAll("*").remove();

            g = svg.append("g");

            // Zoom behavior
            const zoom = d3.zoom().on("zoom", (event) => {
                g.attr("transform", event.transform);
            });
            svg.call(zoom);

            const nodes = graphData.nodes.map(d => Object.create(d));
            const links = graphData.edges.map(d => Object.create(d));

            simulation = d3.forceSimulation(nodes)
                .force("link", d3.forceLink(links).id(d => d.id).distance(80))
                .force("charge", d3.forceManyBody().strength(-150))
                .force("center", d3.forceCenter(width / 2, height / 2))
                .force("collision", d3.forceCollide().radius(d => Math.max(8, d.degree * 2)));

            link = g.append("g")
                .selectAll("line")
                .data(links)
                .join("line")
                .attr("class", "link");

            node = g.append("g")
                .selectAll(".node")
                .data(nodes)
                .join("g")
                .attr("class", "node")
                .call(d3.drag()
                    .on("start", dragstarted)
                    .on("drag", dragged)
                    .on("end", dragended))
                .on("click", (event, d) => showDetail(d));

            node.append("circle")
                .attr("r", d => Math.max(6, Math.min(20, 5 + d.degree * 1.5)))
                .attr("fill", d => colorMap[d.community] || '#94a3b8');

            node.append("text")
                .attr("dx", 12)
                .attr("dy", ".35em")
                .text(d => d.label);

            simulation.on("tick", () => {
                link
                    .attr("x1", d => d.source.x)
                    .attr("y1", d => d.source.y)
                    .attr("x2", d => d.target.x)
                    .attr("y2", d => d.target.y);

                node
                    .attr("transform", d => `translate(${d.x},${d.y})`);
            });
        }

        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }
        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }
        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }

        function showDetail(d) {
            document.getElementById('detail-drawer').style.display = 'block';
            document.getElementById('detail-title').innerText = d.label;
            document.getElementById('detail-type').innerText = d.type.toUpperCase();
            document.getElementById('detail-desc').innerText = d.description || 'No detailed description available.';
            document.getElementById('detail-degree').innerText = d.degree;
            document.getElementById('detail-in').innerText = d.inDegree;
            document.getElementById('detail-out').innerText = d.outDegree;
            document.getElementById('detail-comm').innerText = d.community;
            document.getElementById('detail-file').innerText = d.filepath || 'N/A';

            // Highlight connections
            link.classed("highlight", l => l.source.id === d.id || l.target.id === d.id);
        }

        function closeDetail() {
            document.getElementById('detail-drawer').style.display = 'none';
            link.classed("highlight", false);
        }

        function selectNode(nodeId) {
            const found = graphData.nodes.find(n => n.id === nodeId);
            if (found) showDetail(found);
        }

        function filterGraph() {
            const query = document.getElementById('search-input').value.toLowerCase();
            node.style("opacity", d => d.label.toLowerCase().includes(query) || d.type.toLowerCase().includes(query) ? 1 : 0.15);
        }
    </script>
</body>
</html>
